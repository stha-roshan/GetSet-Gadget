<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Category</title>
    <link rel="stylesheet" href="../styles/category_form.css">
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h1>Add New Category</h1>
            <p>Fill in the category details below</p>
        </div>

        <form id="categoryForm">
            <div class="form-content">
                <div class="form-group">
                    <label for="categoryName">
                        Category Name <span class="required">*</span>
                    </label>

                    <input 
                        type="text" 
                        id="categoryName" 
                        name="categoryName"
                        placeholder="e.g., Electronics, Clothing, Books"
                        maxlength="50"
                        autocomplete="off"
                    >

                    <div class="char-counter">
                        <span>Enter category name</span>
                        <span class="char-remaining"><span id="nameCount">0</span>/50</span>
                    </div>
                    <div class="input-feedback"></div>
                </div>

                <div class="form-group">
                    <label for="categoryDescription">
                        Description <span class="required">*</span>
                    </label>

                    <textarea 
                        id="categoryDescription" 
                        name="categoryDescription"
                        placeholder="Describe the category in detail..."
                        maxlength="500"
                        rows="5"
                    ></textarea>

                    <div class="char-counter">
                        <span>Provide detailed description</span>
                        <span class="char-remaining"><span id="descCount">0</span>/500</span>
                    </div>
                    <div class="input-feedback"></div>
                </div>
            </div>

            <div class="form-footer">
                <button type="button" class="btn btn-secondary">
                    Clear
                </button>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    + Create Category
                </button>
            </div>
        </form>
    </div>

    <!-- Toast Notification (hidden by default) -->
    <div class="toast" id="toast">
        Category created successfully!
    </div>

    <script src="../scripts/category_form.js"></script>
</body>
</html>
