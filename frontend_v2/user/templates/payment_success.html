<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Payment...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #28a745; border-radius: 50%; width: 50px; height: 50px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="status-container">
        <h1>Verifying Your Payment</h1>
        <div class="loader"></div>
        <p>Please do not refresh the page...</p>
    </div>

    <script>
        async function completeOrder() {
            // 1. Get the encoded 'data' from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get("data");
            const token = localStorage.getItem("accessToken");

            if (!encodedData) {
                showError("No payment data found in URL.");
                return;
            }

            try {
                // 2. Call your backend to verify and update DB
                const response = await fetch("http://localhost:3000/api/orders/verify-payment", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ data: encodedData })
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById("status-container").innerHTML = `
                        <h1 style="color: green;">Payment Successful!</h1>
                        <p>Order ID: ${result.data.orderNumber}</p>
                        <p>You will be redirected to your profile in 5 seconds.</p>
                        <a href="/profile.html">Go to Profile Now</a>
                    `;
                    // Redirect after 5 seconds
                    setTimeout(() => { window.location.href = "/profile.html"; }, 5000);
                } else {
                    showError(result.message);
                }
            } catch (error) {
                console.error("Verification error:", error);
                showError("Failed to connect to the server.");
            }
        }

        function showError(msg) {
            document.getElementById("status-container").innerHTML = `
                <h1 style="color: red;">Verification Failed</h1>
                <p>${msg}</p>
                <a href="/checkout.html">Try Again</a>
            `;
        }

        // Start the process as soon as the page loads
        document.addEventListener("DOMContentLoaded", completeOrder);
    </script>
</body>
</html>
